<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Open a shared note | D Notes</title>
  <style>
    body { margin: 0; font: 1rem/1.55 system-ui, sans-serif; color-scheme: light dark; }
    main { max-width: 30rem; margin: 12vh auto; padding: 1.5rem; }
    h1 { line-height: 1.15; }
    button { font: inherit; font-weight: 600; padding: .6rem 1rem; cursor: pointer; }
  </style>
  <script src="./copy-invitation.js" defer></script>
</head>
<body>
  <main>
    <h1>Open a shared note</h1>
    <p>Copy this invitation, then open <strong>Open shared note</strong> from
      the D Notes menu and paste it there.</p>
    <button type="button" id="copy-invitation">Copy invitation</button>
    <p id="copy-status" role="status"></p>
    <p><a href="https://play.google.com/store/apps/details?id=com.dvdb.bergnotes">Get D Notes on Google Play</a></p>
  </main>
</body>
</html>
