name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Verify the site
        run: python3 tests/verify.py

      - name: Assemble the static site
        run: |
          mkdir _site
          rsync -a \
            --exclude '.*' \
            --exclude '_site' \
            --exclude 'tests' \
            --exclude 'README.md' \
            ./ _site/
          mkdir -p _site/.well-known
          cp .well-known/assetlinks.json _site/.well-known/assetlinks.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
